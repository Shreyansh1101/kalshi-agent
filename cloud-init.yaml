#cloud-config
runcmd:
  - for i in 1 2 3; do apt-get update -qq && break || sleep 20; done
  - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-venv git
  - sudo -u ubuntu git clone https://github.com/Shreyansh1101/kalshi-agent.git /home/ubuntu/kalshi-bot
  - sudo -u ubuntu python3 -m venv /home/ubuntu/kalshi-bot/.venv
  - sudo -u ubuntu /home/ubuntu/kalshi-bot/.venv/bin/pip install -q -r /home/ubuntu/kalshi-bot/requirements.txt
  - chmod +x /home/ubuntu/kalshi-bot/generate_keys.sh /home/ubuntu/kalshi-bot/go-live.sh /home/ubuntu/kalshi-bot/go-dry-run.sh
  - sudo -u ubuntu /home/ubuntu/kalshi-bot/generate_keys.sh /home/ubuntu/.kalshi
  - cp /home/ubuntu/kalshi-bot/kalshi-bot.service /etc/systemd/system/kalshi-bot.service
  - systemctl daemon-reload
  - systemctl enable --now kalshi-bot.service
final_message: "Kalshi bot installed. Check: journalctl -u kalshi-bot"
