#cloud-config
# Kalshi bot — first-boot self-install for an Oracle Cloud Always Free
# VM.Standard.E2.1.Micro instance (Ubuntu 24.04).
#
# HOW TO USE
#   1. Push this repo to YOUR OWN GitHub repo (no secrets in it — the Kalshi
#      private key is placed on the instance out-of-band, see README step 4).
#      If the repo is private, create the instance first and clone manually
#      instead (README "Manual install"), or embed a fine-grained PAT in the
#      URL below — never commit the PAT to the repo itself.
#   2. Replace REPO_URL below with your repo's HTTPS URL.
#   3. In the Oracle console: Compute -> Create instance
#        Shape: VM.Standard.E2.1.Micro (Always Free; this is your 2nd of 2)
#        Image: Ubuntu 24.04
#        Networking: VCN with a public subnet, "Assign a public IPv4 address"
#        Management -> Initialization script -> PASTE THIS WHOLE FILE
#   4. Create the instance, wait ~3-5 minutes, then SSH in and verify:
#        journalctl -u kalshi-bot -f
#      The bot starts in DRY_RUN mode: it only logs what it WOULD trade.
#      Place your Kalshi private key on the instance manually afterwards
#      (README step 4) — it is never in the repo or in this script.
#
#   ===> EDIT THIS: your repo URL <===
#   vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv

runcmd:
  # -- system packages (retry: apt can be briefly locked on first boot) --
  - for i in 1 2 3; do apt-get update -qq && break || sleep 20; done
  - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-venv git
  # -- bot code (as the ubuntu user, so file ownership is correct) --
  - sudo -u ubuntu git clone https://github.com/Shreyansh1101/kalshi-agent.git /home/ubuntu/kalshi-bot
  - sudo -u ubuntu python3 -m venv /home/ubuntu/kalshi-bot/.venv
  - sudo -u ubuntu /home/ubuntu/kalshi-bot/.venv/bin/pip install -q -r /home/ubuntu/kalshi-bot/requirements.txt
  - chmod +x /home/ubuntu/kalshi-bot/generate_keys.sh
  # -- install + start the systemd service (DRY_RUN=true by default) --
  - cp /home/ubuntu/kalshi-bot/kalshi-bot.service /etc/systemd/system/kalshi-bot.service
  - systemctl daemon-reload
  - systemctl enable --now kalshi-bot.service

final_message: "Kalshi bot cloud-init finished. Check: journalctl -u kalshi-bot"
